name: ci

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore intralogistics-orchestrator.sln

      - name: Build
        run: dotnet build intralogistics-orchestrator.sln --no-restore -warnaserror

      - name: Test
        run: dotnet test intralogistics-orchestrator.sln --no-build --verbosity normal